server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # automatic routing based on eureka
          lower-case-service-id: true
      routes:
        - id: live-game-websocket
          uri: lb://live-game-events-service
          predicates:
            - Path=/ws-quadball/**
          filters:
            - PreserveHostHeader
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/