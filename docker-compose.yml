services:

  postgres:
    image: postgres:16-alpine
    container_name: quadball-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # script that creates user_db, tournament_db, ecc. on startup
      - ./docker/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    networks:
      - quadball-net

networks:
  quadball-net:
    driver: bridge