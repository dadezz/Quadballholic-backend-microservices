server:
  port: 8082

spring:
  application:
    name: team-service
  datasource:
    url: jdbc:postgresql://localhost:5432/team_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

bezkoder:
  app:
    jwtSecret: ${JWT_SECRET}
    AccessTokenExpirationMs: 3600000

common:
  frontend:
    url: ${FE_URL}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
