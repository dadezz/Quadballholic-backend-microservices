server:
  port: 8085

spring:
  application:
    name: player-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/player_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:false}
    password: ${MAIL_PASSWORD:false}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

quadballholic:
  app:
    jwtSecret: ${JWT_SECRET}
    AccessTokenExpirationMs: 3600000
    security:
      public-paths: "/api/players/**, /api/players"

common:
  frontend:
    url: ${FE_URL}


management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info