server:
  port: 8087

spring:
  application:
    name: tournament-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tournament_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:false}
    password: ${MAIL_PASSWORD:false}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

common:
  frontend:
    url: ${FE_URL}

quadballholic:
  app:
    jwtSecret: ${JWT_SECRET}
    AccessTokenExpirationMs: 3600000
    security:
      public-paths: "/api/tournaments/**, /api/tournaments, /api/tournament-management, /api/tournament-management/**"

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info